spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
      format_sql: true
  application:
    name: fixr
  ai:
    model:
      embedding: none
  flyway:
    enabled: true

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    listener:
      simple:
        default-requeue-rejected: ${REQUEUE_REJECTED:false}
        concurrency: ${CONCURRENCY:3}
        max-concurrency: ${MAX_CONCURRENCY:9}
        retry:
          enabled: ${RETRY_ENABLED:true}
          max-retries: ${RETRY_MAX_RETRIES:3}
          initial-interval: ${RETRY_INITIAL_INTERVAL:1000}
          multiplier: ${EXPONENTIAL_BACKOFF_MULTIPLIER:2.0}
          max-interval: ${RETRY_MAX_INTERVAL:10000}

fixr:
  security:
    profile: Dev
    secretKey: 01a123b7-d2cf-7541-8772-74db437ce14d
    accessTokenExpirationMinutes: 30
    refreshTokenExpirationDays: 7
    domain: localhost
    allowedOrigins: ${ALLOWED_ORIGINS}
    moderatorUsernames: ${FIXR_MODERATOR_USERNAMES:}
  rabbit-mq:
    fixr-exchange-name: ${FIXR_RABBITMQ_EXCHANGE:fixr.exchange}
    request-queue: ${FIXR_RABBITMQ_REQUEST_QUEUE:embedding.request}
    completed-queue: ${FIXR_RABBITMQ_COMPLETED_QUEUE:embedding.completed}
    request-queue-rk: ${FIXR_RABBITMQ_REQUEST_ROUTING_KEY:embedding.request}
    request-failed-rk: ${FIXR_RABBITMQ_REQUEST_FAILED_ROUTING_KEY:embedding.failed}
    completed-queue-rk: ${FIXR_RABBITMQ_COMPLETED_ROUTING_KEY:embedding.completed}
    dlx: ${FIXR_RABBITMQ_DEAD_LETTER_EXCHANGE:fixr.dead-letter}
    dlq: ${FIXR_RABBITMQ_DEAD_LETTER_QUEUE:embedding.dead-letter}
    dlrk: ${FIXR_RABBITMQ_DEAD_LETTER_ROUTING_KEY:embedding.dead-letter}
  report:
    embedding:
      proximity-threshold: ${FIXR_PROXIMITY_THRESHOLD}
      distance-weight: ${FIXR_EMBEDDING_PROXIMITY_WEIGHT}
      text-weight: ${FIXR_EMBEDDING_TEXT_WEIGHT}
      visuals-weight: ${FIXR_EMBEDDING_VISUALS_WEIGHT}
  validation:
    minimum-voters: ${FIXR_VALIDATION_MINIMUM_VOTERS:5}
    support-threshold: ${FIXR_VALIDATION_SUPPORT_THRESHOLD:0.75}
    dispute-threshold: ${FIXR_VALIDATION_DISPUTE_THRESHOLD:0.25}
    score-adjustment: ${FIXR_VALIDATION_SCORE_ADJUSTMENT:2}
    scoring-version: ${FIXR_VALIDATION_SCORING_VERSION:1.0}
    outbox-poll-interval-ms: ${FIXR_VALIDATION_OUTBOX_POLL_INTERVAL_MS:1000}
    burst-vote-count: ${FIXR_VALIDATION_BURST_VOTE_COUNT:5}
    burst-window-minutes: ${FIXR_VALIDATION_BURST_WINDOW_MINUTES:10}
    repeated-target-report-count: ${FIXR_VALIDATION_REPEATED_TARGET_REPORT_COUNT:5}
    repeated-target-window-days: ${FIXR_VALIDATION_REPEATED_TARGET_WINDOW_DAYS:30}
    reciprocal-reports-per-direction: ${FIXR_VALIDATION_RECIPROCAL_REPORTS_PER_DIRECTION:2}
    reciprocal-window-days: ${FIXR_VALIDATION_RECIPROCAL_WINDOW_DAYS:90}
